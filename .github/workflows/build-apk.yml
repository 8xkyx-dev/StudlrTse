
name: Build StudlrTse APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'StudlrTse-Android.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

env:
  JAVA_VERSION: '17'
  ANDROID_PLATFORM: '35'

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-${ANDROID_PLATFORM}" "build-tools;35.0.0"

      - name: Extract Android project
        run: |
          test -f StudlrTse-Android.zip
          mkdir -p "$RUNNER_TEMP/studlrtse"
          unzip -q StudlrTse-Android.zip -d "$RUNNER_TEMP/studlrtse"
          test -f "$RUNNER_TEMP/studlrtse/StudlrTse/settings.gradle.kts"

      - name: Build APK
        working-directory: ${{ runner.temp }}/studlrtse/StudlrTse
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: StudlrTse-debug-apk
          path: ${{ runner.temp }}/studlrtse/StudlrTse/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

